<script id="demo-model">
// Small, disposable state for this demonstration; not a future platform model.
globalThis.DemoModel=(()=>{
  const copy=x=>JSON.parse(JSON.stringify(x));
  const doc=(id,title,format,event,date,status,kinds,filename)=>({id,title,format,event,date,status,kinds,filename:filename||title+'（示例）.'+format.toLowerCase()});
  function createState(){
    const s={schema:1,caseId:'frdc',prefs:{theme:'mono',mode:'light'},feedback:[],cases:{
      frdc:{id:'frdc',code:'CASE A / DEMO-001',name:'DEMO-001 委託生產報價',customer:'示例客戶 A',type:'報價案件',period:'2026/08 — 09',status:'已提出兩輪・包裝更新待提出',summary:'已完成兩輪報價，現階段準備捆包變更，追加紙箱包裝的更新版。\n本次先整理既有報價與參考資料，保留每一輪的歷史脈絡。',confirmed:false,stale:false,docs:[
        doc('request','需求與往來信件','MSG','01 需求往來','示例 08/18','參考資料',['mail'],'輪圈需求（示例）.msg'),
        doc('q1','第一輪報價','XLSX','02 報價履歷','第一輪','歷史報價',['quote']),
        doc('q2','第二輪報價','PDF','02 報價履歷','第二輪','目前已提出',['quote','terms']),
        doc('testing','法規測試費用參考','PDF','03 報價參考','參考文件','參考資料',['testing']),
        doc('reference','過往報價參考','XLSX','03 報價參考','參考文件','參考資料',['reference'])
      ],order:['request','q1','q2','testing'],undo:[],changes:[],snapshots:[]},
      cmw:{id:'cmw',code:'示例客戶 B / VISIT 0901',name:'9/1 示例客戶 B 客戶來訪',customer:'示例客戶 B',type:'客戶來訪',period:'2026/09/01',status:'來訪資料整理中',summary:'將本次來訪的行程、會議簡報與背景參考資料整理在一起。\n挑選本次卷宗需要的內容，再加入合照版位與手寫補充空間。',confirmed:false,stale:false,docs:[
        doc('agenda','來訪行程與對應安排','XLSX','01 來訪準備','09/01','行程示例',['agenda','reception']),
        doc('poster','歡迎海報','PDF','01 來訪準備','09/01','附件示例',['poster']),
        doc('slides','經營懇談會簡報','PDF','02 會議資料','09/01','報告示例',['slides','topics']),
        doc('background','訂單與專案參考','XLSX','02 會議資料','背景資料','參考資料',['reference']),
        doc('energy','能源費・原料參考','XLSX','02 會議資料','背景資料','參考資料',['energy']),
        doc('photos','紀念合照版位','IMAGE','03 會後整理','09/01','圖片版位示例',['photo'])
      ],order:['agenda','poster','slides','photos'],undo:[],changes:[],snapshots:[]}
    }};
    Object.values(s.cases).forEach(c=>{c.defaultOrder=copy(c.order);c.snapshots=[{id:'output-1',label:'輸出版 1・初始示例',created:'初始示範版本',pages:pages(c),summary:c.summary,order:copy(c.order)}];});
    return s;
  }
  function pages(c){
    const chosen=c.order.map(id=>c.docs.find(d=>d.id===id)).filter(Boolean);
    const tocCount=Math.max(1,Math.ceil((chosen.length+1)/12));
    let cursor=2+tocCount;
    const entries=[{id:'summary',title:'案件摘要與履歷',start:cursor}];cursor++;
    chosen.forEach(d=>{entries.push({id:d.id,title:d.title,start:cursor,count:d.kinds.length});cursor+=d.kinds.length;});
    const base={caseId:c.id,caseName:c.name,customer:c.customer,period:c.period};
    const result=[{...base,kind:'cover',title:c.name},...Array.from({length:tocCount},(_,i)=>({...base,kind:'toc',title:'卷宗目錄',entries:entries.slice(i*12,(i+1)*12)})),{...base,kind:'summary',title:'案件摘要與履歷',text:c.summary,stale:c.stale}];
    chosen.forEach(d=>d.kinds.forEach((kind,i)=>result.push({...base,kind,title:d.title,docId:d.id,status:d.status,date:d.date,filename:d.filename,part:i+1,parts:d.kinds.length})));
    return result.map((p,i)=>({...p,number:i+1,total:result.length}));
  }
  function edit(state,id,fn){const s=copy(state);const c=s.cases[id];if(!c)return s;fn(c,s);return s;}
  function remember(c,text){c.undo.push(copy(c.order));if(c.undo.length>12)c.undo.shift();c.changes.unshift(text);c.changes=c.changes.slice(0,5);}
  function include(s,id,docId,on){return edit(s,id,c=>{if(!c.docs.some(d=>d.id===docId)||c.order.includes(docId)===on)return;const d=c.docs.find(d=>d.id===docId);remember(c,(on?'＋ 納入 ':'− 移出本次卷宗 ')+d.title);if(on)c.order.push(docId);else c.order=c.order.filter(x=>x!==docId);});}
  function move(s,id,docId,to){return edit(s,id,c=>{if(!c.docs.some(d=>d.id===docId))return;remember(c,'↕ 調整 '+c.docs.find(d=>d.id===docId).title+' 的位置');c.order=c.order.filter(x=>x!==docId);c.order.splice(Math.max(0,Math.min(to,c.order.length)),0,docId);});}
  function handwriting(s,id){return edit(s,id,c=>{const docId='memo-'+(c.docs.filter(d=>d.id.startsWith('memo-')).length+1);remember(c,'＋ 加入手寫補充頁');c.docs.push(doc(docId,'手寫補充頁','NOTE','04 補充空間','本次編排','手寫頁',['memo']));c.order.push(docId);});}
  function undo(s,id){return edit(s,id,c=>{if(c.undo.length){c.order=c.undo.pop();c.changes.unshift('↶ 已復原上一步編排');c.changes=c.changes.slice(0,5);}});}
  function scenario(s,id){return edit(s,id,c=>{const d=id==='cmw'?doc('minutes','會後紀錄・合成示例','NOTE','03 會後整理','示例 09/02','待確認示例',['minutes']):doc('pack','追加紙箱包裝・更新草稿','XLSX','04 包裝變更','尚待提出','待提出草稿',['pack','packing']);if(c.docs.some(x=>x.id===d.id))return;d.isNew=true;c.docs.push(d);c.stale=true;});}
  function snapshot(s,id){return edit(s,id,c=>{const index=c.snapshots.length+1;c.snapshots.push({id:'output-'+index,label:'輸出版 '+index,created:new Date().toLocaleString('zh-TW',{hour12:false}),pages:copy(pages(c)),summary:c.summary,order:copy(c.order)});});}
  function reset(s){const fresh=createState();fresh.feedback=copy(s.feedback);fresh.prefs=copy(s.prefs);return fresh;}
  function csvCell(value){let s=String(value??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
  return {createState,copy,pages,edit,remember,include,move,handwriting,undo,scenario,snapshot,reset,csvCell};
})();
</script>
<script id="demo-feedback">
// One immutable file per submission; no shared read/modify/write aggregate.
globalThis.DemoFeedback=(()=>{
  const folderName='WS-UIUX-回饋',app='ws-uiux-feedback',pattern=/^ws-feedback-([0-9a-f-]{36})\.json$/;
  const limits={reviewerName:60,opinion:3000,caseId:100,caseName:200,screen:100,type:80,difficulty:100,theme:80,mode:20,created:100};
  function record(value){
    if(!value||value.app!==app||value.schema!==1||!pattern.test('ws-feedback-'+value.id+'.json')||!Number.isFinite(Date.parse(value.createdAt)))throw new Error('回饋格式不符');
    const result={app,schema:1,id:value.id,createdAt:value.createdAt};
    for(const [key,max] of Object.entries(limits)){if(typeof value[key]!=='string'||value[key].length>max)throw new Error('回饋欄位不符');result[key]=value[key];}
    if(!result.reviewerName.trim()||!result.opinion.trim())throw new Error('姓名與意見必填');
    return result;
  }
  async function read(dir){
    const records=[],seen=new Set();let skipped=0,visited=0;
    for await(const [name,handle] of dir.entries()){
      if(handle.kind!=='file'||!pattern.test(name))continue;
      if(++visited>2000)throw new Error('回饋檔案超過本次 Demo 可讀取的 2000 則，請主持人分批封存。');
      // I/O errors stop refresh; keep the last successful board instead of hiding rows.
      const file=await handle.getFile();if(file.size>64000){skipped++;continue;}
      const raw=await file.text();let value;
      try{value=record(JSON.parse(raw));if(name!=='ws-feedback-'+value.id+'.json'||seen.has(value.id))throw new Error('不符');}catch{skipped++;continue;}
      seen.add(value.id);records.push(value);
    }
    records.sort((a,b)=>b.createdAt.localeCompare(a.createdAt)||a.id.localeCompare(b.id));
    return {records,skipped};
  }
  async function write(dir,input){
    const value=record(input),name='ws-feedback-'+value.id+'.json',serialized=JSON.stringify(value,null,2);let handle;
    try{handle=await dir.getFileHandle(name);const file=await handle.getFile();if(file.size){
      const previous=record(JSON.parse(await file.text()));
      if(JSON.stringify(previous)!==JSON.stringify(value))throw new Error('同名回饋檔內容不同，未覆寫。');
      return value;
    }}catch(error){if(error.name!=='NotFoundError')throw error;}
    handle=handle||await dir.getFileHandle(name,{create:true});let stream;
    try{stream=await handle.createWritable();await stream.write(serialized);await stream.close();stream=null;}catch(error){if(stream)try{await stream.abort();}catch{}throw error;}
    const verified=record(JSON.parse(await (await handle.getFile()).text()));
    if(JSON.stringify(verified)!==JSON.stringify(value))throw new Error('寫入後核對失敗，請重新讀取確認。');
    return verified;
  }
  return {folderName,app,record,read,write};
})();
</script>

const outputOrder=()=>readonly()?(saved()?.order||current().order):current().order;
function readStorage(){try{const raw=JSON.parse(localStorage.getItem(STORE)||'null');if(raw?.schema===1&&raw.cases?.frdc&&raw.cases?.cmw&&Array.isArray(raw.cases.frdc.docs)&&raw.cases[raw.caseId])state=raw;const feedback=JSON.parse(localStorage.getItem(FEEDBACK)||'[]');if(Array.isArray(feedback))state.feedback=feedback;}catch{storageOK=false;state=M.createState();}if(!names[state.prefs?.theme])state.prefs={theme:'mono',mode:'light'};if(!['light','dark'].includes(state.prefs.mode))state.prefs.mode='light';}
function persist(){try{localStorage.setItem(FEEDBACK,JSON.stringify(state.feedback));localStorage.setItem(STORE,JSON.stringify(state));}catch{storageOK=false;}}
function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').classList.add('visible');toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),3500);}
function appearance(){document.documentElement.dataset.theme=state.prefs.theme;document.documentElement.dataset.mode=state.prefs.mode;$('themes').innerHTML=Object.entries(names).map(([key,name])=>btn('theme',`<span class="swatch" style="background:${{mono:'#8c3d3d',graphite:'#657d8c',geist:'#222',carbon:'#0f62fe'}[key]}"></span>${name}`,`data-theme="${key}" aria-pressed="${state.prefs.theme===key}"`,state.prefs.theme===key?'active':'')).join('');$('modes').innerHTML=['light','dark'].map(v=>btn('mode',icon(v==='light'?'sun':'moon')+(v==='light'?'淺色':'深色'),`data-mode="${v}" aria-pressed="${state.prefs.mode===v}"`,state.prefs.mode===v?'active':'')).join('');}
function sidebarLayout(){const collapsed=state.prefs.sidebarCollapsed===true;document.documentElement.dataset.sidebar=collapsed?'collapsed':'expanded';const button=$('sidebar-toggle'),label=collapsed?'展開側邊欄':'收合側邊欄';button.setAttribute('aria-expanded',String(!collapsed));button.setAttribute('aria-label',label);button.title=label;button.innerHTML=`<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="${collapsed?'M9 6l6 6-6 6':'M15 6l-6 6 6 6'}"/></svg>`;}
function renderSidebar(){const c=current();$('case-shortcuts').innerHTML=Object.values(state.cases).map(x=>`<button class="case-shortcut ${ui.tab!=='home'&&c.id===x.id?'active':''}" data-action="case" data-id="${esc(x.id)}" title="${esc(x.customer)} · ${esc(x.name)}" aria-label="${esc(x.customer)} · ${esc(x.name)}"><span class="case-dot"></span><span class="case-icon" aria-hidden="true">${icon(x.id==='cmw'?'users':'folder')}</span><span class="case-copy"><strong>${esc(x.customer)} ${x.id==='frdc'?'DEMO-001':x.id==='cmw'?'9/1 來訪':'示範案件'}</strong><small>${esc(x.type)}</small></span></button>`).join('');$('nav-home').innerHTML=icon('grid')+'<span class="side-label">案件一覽</span>';$('nav-dossier').innerHTML=icon('book')+'<span class="side-label">卷宗編排</span>';$('nav-home').classList.toggle('active',ui.tab==='home');$('nav-dossier').classList.toggle('active',ui.tab==='dossier');$('guide-button').innerHTML=icon('play')+'操作導覽';$('feedback-button').innerHTML=icon('message')+`留下意見 <span style="opacity:.65">${state.feedback.length||''}</span>`;sidebarLayout();}
function renderHeader(){const c=current();if(ui.tab==='home'){$('case-head').innerHTML='';return;}const has=c.docs.some(d=>d.id===(c.id==='cmw'?'minutes':'pack'));$('case-head').innerHTML=`<div class="breadcrumb"><span>工作案例</span><span>›</span><span>${esc(c.customer)}</span><span class="mono" style="margin-left:auto">${esc(c.code)}</span></div><div class="case-title-row"><div><h1>${esc(c.name)}</h1><p class="subtitle">${esc(c.id==='frdc'?'兩輪報價，一條清楚的脈絡。下一步：追加紙箱包裝。':c.id==='cmw'?'從來訪準備到會後整理，讓資料自然形成一份卷宗。':'用一個簡單案例，試試資料與卷宗的操作方式。')}</p><div class="case-status"><span class="pill good">${icon('check')}${esc(c.type)}</span><span class="pill">${icon('clock')}${esc(c.period)}</span><span class="pill warn">${esc(c.status)}</span></div></div><div class="case-title-actions">${btn('scenario',icon('plus')+(c.id==='cmw'?'加入會後紀錄示例':'加入包裝更新草稿'),has||!['frdc','cmw'].includes(c.id)?'disabled':'','small')}${btn('case-info',icon('info'),'aria-label="案例與示範說明"','icon-btn')}</div></div><nav class="tabs" aria-label="案件檢視">${Object.entries(tabNames).filter(([k])=>k!=='home').map(([key,name])=>btn('nav',name,`data-tab="${key}" aria-current="${ui.tab===key?'page':'false'}"`,ui.tab===key?'active':'')).join('')}</nav>`;}
function docCard(d,wide=false){const included=current().order.includes(d.id);const status=d.isNew?'<span class="pill accent">NEW</span>':`<span class="doc-date">${esc(d.date)}</span>`;return `<article class="doc-card ${d.isNew?'is-new':''}" draggable="${!readonly()}" data-drag-id="${esc(d.id)}"><div class="doc-top"><span class="format">${esc(d.format)}</span>${status}</div><h4>${esc(d.title)}</h4><div class="file-name" title="${esc(d.filename)}">${esc(d.filename)}</div><div class="card-bottom"><span class="pill ${included?'good':d.isNew?'warn':''}">${included?'✓ 已納入':d.isNew?'尚未納入':esc(d.status)}</span><div class="card-actions">${btn('document',icon('eye'),`data-id="${esc(d.id)}" aria-label="查看 ${esc(d.title)}" title="查看示例內容"`,'icon-btn ghost')}${btn(included?'exclude':'include',icon(included?'minus':'plus'),`data-id="${esc(d.id)}" ${readonly()?'disabled':''} aria-label="${included?'移出本次卷宗':'納入卷宗'} ${esc(d.title)}" title="${included?'移出本次卷宗':'納入卷宗'}"`,'icon-btn')}</div></div>${wide?`<p class="muted" style="font-size:10px;margin-top:10px">${esc(d.event)} · ${d.kinds.length} 頁示例</p>`:''}</article>`;}
function filteredDocs(){return current().docs.filter(d=>(ui.poolFilter!=='pending'||!current().order.includes(d.id))&&(!ui.query||[d.title,d.filename,d.event].join(' ').toLowerCase().includes(ui.query.toLowerCase())));}
function poolContent(){const groups={};filteredDocs().forEach(d=>(groups[d.event]??=[]).push(d));return Object.entries(groups).map(([event,docs])=>`<div class="group-label">${esc(event)}</div>${docs.map(d=>docCard(d)).join('')}`).join('')||'<div class="empty">沒有符合的資料</div>';}
function pageRange(id){const p=outputPages().filter(p=>p.docId===id);return p.length?`P.${p[0].number}${p.length>1?'–'+p.at(-1).number:''}`:'';}
function renderOrder(){const c=current(),order=outputOrder();return `<div class="generated-row">${icon('paper')}封面<span class="page-range mono">P.1</span></div><div class="generated-row">${icon('book')}目錄・案件摘要<span class="page-range mono">P.2–${outputPages().find(p=>p.kind==='summary').number}</span></div><div class="generated-divider"></div>${order.map((id,i)=>{const d=c.docs.find(x=>x.id===id);if(!d)return '';return `<article class="order-card ${d.kinds[0]==='memo'?'memo':''}" draggable="${!readonly()}" data-order-id="${esc(id)}" data-drag-id="${esc(id)}"><span class="grip">${icon('grip')}</span><div class="grow"><h4>${esc(d.title)}</h4><div class="order-meta"><span class="mono">${pageRange(id)}</span> · ${esc(d.status)}</div></div><div class="order-actions">${btn('page-doc',icon('eye'),`data-id="${esc(id)}" title="在右側預覽" aria-label="預覽 ${esc(d.title)}"`)}${btn('up',icon('up'),`data-id="${esc(id)}" ${readonly()||i===0?'disabled':''} aria-label="上移 ${esc(d.title)}"`)}${btn('down',icon('down'),`data-id="${esc(id)}" ${readonly()||i===order.length-1?'disabled':''} aria-label="下移 ${esc(d.title)}"`)}${btn('exclude',icon('minus'),`data-id="${esc(id)}" ${readonly()?'disabled':''} aria-label="移出本次卷宗 ${esc(d.title)}"`)}</div></article>`;}).join('')}${!order.length?'<div class="empty">把左側資料拖到這裡<br>或按卡片上的 ＋ 納入卷宗</div>':''}${btn('handwriting',icon('plus')+'插入手寫補充頁',readonly()?'disabled':'','add-page')}`;}
function renderBuilder(){const c=current(),pg=outputPages();ui.page=Math.min(Math.max(1,ui.page),pg.length);return `<div class="workspace-intro"><div class="row">${icon('book')}<strong>編好這次要帶走的資料</strong><span class="muted">${readonly()?'歷史輸出版・唯讀':'從左側挑選，拖動中間卡片調整順序。'}</span></div>${btn('toggle-preview',icon(ui.hidePreview?'eye':'expand')+(ui.hidePreview?'顯示預覽':'收合預覽'),'','small ghost')}</div><div class="builder-grid"><section class="panel"><div class="panel-heading"><h3><span class="step-number">01</span> 案件資料池</h3><span class="badge-count">${c.docs.length}</span></div><p class="panel-subtitle">資料保留在案件裡，按需放進卷宗。</p><div class="search-wrap">${icon('search')}<input id="pool-search" aria-label="搜尋案件資料" placeholder="搜尋文件、事件…" value="${esc(ui.query)}"></div><div class="panel-controls">${btn('filter','全部資料','data-filter="all" aria-pressed="'+(ui.poolFilter==='all')+'"','small filter-btn '+(ui.poolFilter==='all'?'active':''))}${btn('filter','尚未納入','data-filter="pending" aria-pressed="'+(ui.poolFilter==='pending')+'"','small filter-btn '+(ui.poolFilter==='pending'?'active':''))}</div><div class="pool-scroll" id="pool-list">${poolContent()}</div><div class="panel-footer"><span>示例文件・可拖拉</span>${btn('files',icon('plus')+'選取本機檔案',readonly()?'disabled':'','small ghost')}</div></section><section class="panel"><div class="panel-heading"><h3><span class="step-number">02</span> ${readonly()?'已保存編排':'本次卷宗'}</h3><span class="pill ${readonly()?'':'accent'}">${readonly()?'唯讀':'草稿'}</span></div><p class="panel-subtitle">${readonly()?'查看當時保存的內容與排列。':'移出卷宗不會刪除原始資料。'}</p><div class="panel-controls">${btn('sort',icon('clock')+'依事件排序',readonly()?'disabled':'','small')}${btn('undo',icon('undo'),'aria-label="復原上一步編排" title="復原上一步編排" '+(readonly()||!c.undo.length?'disabled':''),'small')}${readonly()?btn('draft','回到草稿','','small primary'):''}</div><div class="order-scroll" id="order-list">${renderOrder()}</div><div class="changes">${c.changes.length?`<strong>${esc(c.changes[0])}</strong>`:'拖動卡片，看看右側的變化。'}</div><div class="panel-footer"><span>${outputOrder().length} 項資料 · <strong>${pg.length} 頁</strong></span>${btn('snapshot',icon('save')+'保存輸出版',readonly()?'disabled':'','small primary')}</div></section><section class="panel preview-panel"><div class="panel-heading"><h3><span class="step-number">03</span> 紙本預覽</h3>${btn('expand',icon('expand'),'aria-label="放大卷宗預覽"','icon-btn ghost')}</div><div class="preview-toolbar"><select id="output-select" aria-label="選擇卷宗草稿或輸出版"><option value="draft">目前草稿 · 即時更新</option>${c.snapshots.map(s=>`<option value="${s.id}" ${ui.output===s.id?'selected':''}>${esc(s.label)} · 已保存</option>`).join('')}</select>${btn('print',icon('print'),'aria-label="列印目前卷宗" title="列印目前顯示的卷宗"','icon-btn')}</div><div class="paper-viewport" id="paper-viewport"><div style="width:100%;display:flex;justify-content:center">${paper(pg[ui.page-1],true)}</div></div><div class="preview-bottom"><span class="mono">A4 · ${ui.page} / ${pg.length} 頁</span><div class="row" style="gap:4px">${btn('prev-page',icon('up'),`aria-label="上一頁" ${ui.page===1?'disabled':''}`,'icon-btn ghost')}${btn('next-page',icon('down'),`aria-label="下一頁" ${ui.page===pg.length?'disabled':''}`,'icon-btn ghost')}${btn('toc','目錄','','small ghost')}</div></div><div class="panel-footer"><span>示例頁重編・可放大閱讀</span><span>${readonly()?'已保存':'尚未保存為輸出版'}</span></div></section></div>`;}
function wheel(){return `<svg class="wheel-graphic" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1.4" aria-label="輪圈造型示意圖"><circle cx="100" cy="100" r="90"/><circle cx="100" cy="100" r="78"/><circle cx="100" cy="100" r="24"/><circle cx="100" cy="100" r="12"/>${Array.from({length:5},(_,i)=>`<path transform="rotate(${i*72} 100 100)" d="M91 77L76 26 89 23 107 74M109 77L125 28 138 35 123 92"/>`).join('')}<path d="M0 100h200M100 0v200" stroke-dasharray="3 6" opacity=".2"/></svg>`;}
function table(head,rows){return `<table><thead><tr>${head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
function paperBody(p){switch(p.kind){
case 'cover':return `<div class="cover-kicker">WS / CASE DOSSIER</div><h2>${esc(p.caseName)}</h2><div class="cover-rule"></div><p class="cover-sub">${p.caseId==='cmw'?'來訪準備・會議資料・會後整理':'報價履歷・條件確認・包裝變更'}</p><dl class="cover-info"><dt>客戶</dt><dd>${esc(p.customer)}</dd><dt>涵蓋期間</dt><dd>${esc(p.period)}</dd><dt>整理單位</dt><dd>Wheel Dept. WS 業務課</dd><dt>整理人</dt><dd>WS 同仁甲（示例）</dd><dt>整理日期</dt><dd>2026/09/08（示例）</dd><dt>資料性質</dt><dd>UI/UX 討論用・示例內容</dd></dl>`;

case 'summary':return `<h2>案件摘要與履歷</h2><p style="white-space:pre-line">${esc(p.text)}</p>${p.stale?'<div class="paper-note">來源已有新增資料，這份摘要待重新確認。</div>':''}<h3>目前工作脈絡</h3>${table(['階段','目前狀態'],p.caseId==='cmw'?[['來訪準備','行程與歡迎資料'],['會議資料','簡報與背景參考'],['會後整理','合照版位、紀錄與補充']]:[['需求往來','保留需求與參考'],['報價履歷','已完成兩輪報價'],['下一步','追加紙箱包裝更新版待提出']])}<h3>手寫備註</h3><div class="memo-lines" style="height:22cqw"></div>`;
case 'mail':return `<h2>需求與往來信件</h2><div class="paper-note">依案件情境編寫的示例，非原始信件內容。</div>${table(['項目','示例內容'],[['主旨','PA 車輪圈需求'],['案件','DEMO-001 委託生產'],['往來對象','客戶窗口／WS 同仁甲']])}<h3>需求重點</h3><p>確認委託生產的報價條件，並整理可供討論的品項與參考資料。</p><p>報價履歷保留兩輪紀錄；追加紙箱包裝的條件另以更新草稿呈現。</p><h3>相關資料</h3><ul><li>第一輪報價</li><li>第二輪報價與條件頁</li><li>法規測試費用參考</li></ul>`;
case 'quote':return `<h2>${esc(p.title)}</h2><small>${esc(p.status)} / 示例報價版面</small>${wheel()}${table(['品項','示例數量','示例單價'],[['DEMO-001 輪圈','100 pcs','NT$ 1,680'],['包裝條件','既有方式','另行確認']])}<div class="paper-note">數量、價格與日期僅供介面及紙本版面討論，非本案實際報價。${p.parts>1?'後頁為條件示例。':''}</div>`;
case 'terms':return `<h2>報價條件說明</h2><p>第二輪報價附頁・版面示例</p>${table(['項目','說明'],[['交貨安排','依雙方確認內容安排'],['包裝方式','本頁呈現既有條件'],['有效期間','以正式報價文件為準'],['法規費用','獨立參考資料，不重複列入'],['後續變更','追加紙箱包裝另行準備更新版']])}<h3>補充說明</h3><p>正式價格、數量、日期與交易條件均未於本 Demo 核對。本頁用於討論條件資訊是否好找、是否適合納入卷宗。</p><div class="memo-lines" style="height:30cqw"></div>`;
case 'pack':return `<h2>包裝條件更新草稿</h2><div class="paper-note">待提出・合成示例。並非已向客戶提出的新一輪報價。</div><h3>本次調整</h3><p>在現行捆包方式上，追加紙箱包裝的示例方案。</p>${table(['項目','既有版本','更新草稿'],[['紙箱包裝','既有方式','追加紙箱'],['包材費用','既有條件','待確認'],['其他報價條件','第二輪報價','保留供比較'],['提出狀態','已提出','尚待提出']])}<h3>需確認事項</h3><ul><li>紙箱規格與裝箱方式</li><li>追加費用及條件</li><li>是否納入本次討論用卷宗</li></ul>`;
case 'packing':return `<h2>追加紙箱包裝</h2><p>包裝版位示意・更新草稿附頁</p><svg class="wheel-graphic" viewBox="0 0 200 170" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M30 52l68-31 70 31-70 36z M30 52v79l68 32 70-32V52 M98 88v75 M65 37l70 33v28 M76 100v40"/><path d="M38 120l27 13 M125 117l29-14"/></svg><div class="paper-note">此圖僅示意包裝資訊的呈現位置，不代表實際紙箱尺寸或已確認的包裝設計。</div><h3>討論紀錄</h3><div class="memo-lines" style="height:30cqw"></div>`;
case 'agenda':return `<h2>來訪行程與對應安排</h2><p>2026/09/01 · 示例客戶 B 來訪情境示例</p>${table(['示例時間','活動','對應'],[['09:30','抵達與接待','WS 同仁甲'],['10:00','經營懇談會','會議室'],['11:30','交流與合照','接待人員'],['12:00','餐敘','行程安排']])}<h3>事前準備</h3><ul><li>確認行程與會議資料</li><li>歡迎海報、場地與座位</li><li>餐敘及贈禮準備</li></ul><div class="paper-note">時間、人物、地點均為合成示例；來源行程表未於本 Demo 解析。</div>`;
case 'reception':return `<h2>接待準備備忘</h2>${table(['項目','示例安排'],[['歡迎資料','確認海報與會議室版位'],['餐敘','依來訪行程安排'],['贈禮','數量及交付時間待確認'],['合照','安排拍攝與資料整理']])}<h3>人物互動提醒</h3><p>客戶代表甲：餐敘需求待本次確認。</p><small>紀錄日：2026/09/01（示例）｜來源：本次來訪｜紀錄人：WS 同仁甲</small><div class="memo-lines" style="height:40cqw"></div>`;
case 'poster':return `<div style="padding-top:13cqw;text-align:center"><div class="cover-kicker">WELCOME TO DEMO COMPANY</div><h2 style="font-size:8cqw;margin:8cqw 0">歡迎蒞臨</h2><p style="font-size:4cqw">示例客戶 B 客戶代表</p><div style="width:15%;height:2px;background:#943f3f;margin:7cqw auto"></div><p>2026 / 09 / 01</p>${wheel()}<small>歡迎海報版位示例</small></div>`;

function timeline(c){const items=c.id==='cmw'?[['來訪前','對應準備','行程、歡迎資料與接待安排。'],['09/01','會議與交流','簡報及背景參考資料。'],['來訪後','會後整理','合照、補充紀錄與本次卷宗。']]:[['第一輪','第一次報價','保留第一輪文件，供歷史回看。'],['第二輪','目前已提出的報價','第二輪內容與條件一起查看。'],['下一步','追加紙箱包裝','更新版尚待提出；草稿需與正式提出內容分開。']];return items.map(([date,title,desc])=>`<div class="timeline-item"><div class="timeline-date mono">${date}</div><strong>${title}</strong><p>${desc}</p></div>`).join('');}

function renderHome(){return `<div class="home-heading"><div class="eyebrow">YOUR WORK, IN CONTEXT</div><h1 style="margin-top:9px">從熟悉的工作開始</h1><p class="subtitle">選一個案例，試著把資料整理成想要的卷宗。</p></div><div class="row between" style="margin-bottom:15px"><strong>示範案例 <span class="muted">${Object.keys(state.cases).length}</span></strong>${btn('new-case',icon('plus')+'建立示範案件','','small')}</div><div class="home-grid">${Object.values(state.cases).map(c=>`<button class="home-card" data-action="case" data-id="${esc(c.id)}"><div class="row between"><div class="home-icon">${icon(c.id==='cmw'?'users':'folder')}</div><span class="pill">${esc(c.type)}</span></div><h2>${esc(c.name)}</h2><p>${esc(c.summary).replace(/\n/g,'<br>')}</p><div class="home-footer"><span>${c.docs.length} 項資料 · ${M.pages(c).length} 頁草稿</span><span class="row">進入案例 ${icon('arrow')}</span></div></button>`).join('')}</div><div class="attention-strip"><p>01 找到資料與來源</p><p>02 拖拉整理本次卷宗</p><p>03 告訴我們哪裡還不順手</p></div><div class="callout">這是一份可以自由操作的概念示範。完成後請留下意見，協助我們理解真正的工作習慣。</div>`;}
function fitPaper(){const viewport=$('paper-viewport'),sheet=viewport?.querySelector('.paper-shell');if(sheet&&innerWidth>1150){const width=Math.max(100,Math.min(viewport.clientWidth-34,(viewport.clientHeight-30)*210/297));sheet.style.maxWidth=width+'px';}}
function render(){const scrolls={};['pool-list','order-list','paper-viewport'].forEach(id=>{if($(id))scrolls[id]=$(id).scrollTop;});renderSidebar();renderHeader();$('stage').classList.toggle('no-preview',ui.hidePreview);$('stage').innerHTML=ui.tab==='home'?renderHome():ui.tab==='overview'?renderOverview():ui.tab==='documents'?renderDocuments():ui.tab==='weekly'?renderWeekly():renderBuilder();Object.entries(scrolls).forEach(([id,y])=>{if($(id))$(id).scrollTop=y;});fitPaper();renderGuide();}
function update(fn,message,focusDoc){const before=M.pages(current()).length;state=fn(state);persist();if(focusDoc){ui.output='draft';ui.page=M.pages(current()).find(p=>p.docId===focusDoc)?.number||1;}render();const after=M.pages(current()).length;toast(message+(before!==after?` · ${before} → ${after} 頁，目錄已更新`:''));}
function openDialog(title,body,large=false){lastFocus=document.activeElement;$('dialog').classList.toggle('preview-dialog',large);$('dialog-title').textContent=title;$('dialog-body').innerHTML=body;if(!$('dialog').open)$('dialog').showModal();}

function summaryDialog(){const c=current();openDialog('確認示例整理結果',`<div class="notice">${icon('info')}<span>以下為預設整理結果，並未呼叫 AI。試著修正一項內容，再確認。</span></div><div class="source-label spaced">來源脈絡：${esc(c.name)} → ${c.id==='cmw'?'來訪資料與合成會後紀錄':'兩輪報價與包裝更新待辦'}</div><label for="summary-edit" class="spaced">案件摘要 <span class="muted">最多 420 字</span></label><textarea id="summary-edit" maxlength="420" rows="6">${esc(c.summary)}</textarea><p class="muted" style="font-size:11px;margin-top:8px">你只需確認或修正，不必把既有資訊全部重填。</p><div class="dialog-actions">${btn('ignore-summary','這次略過')}${btn('confirm-summary',icon('check')+'確認此摘要','','primary')}</div>`);}
function captureFeedbackDraft(){if(!$('opinion'))return;shared.draft={reviewerName:$('reviewer-name').value,opinion:$('opinion').value,difficulty:$('difficulty').value};try{localStorage.setItem(DRAFT,JSON.stringify(shared.draft));}catch{}}
function feedbackRows(){return shared.view==='shared'?shared.rows:state.feedback;}
function feedbackCards(rows,remote=false){return rows.length?rows.slice().sort((a,b)=>String(b.createdAt||b.created).localeCompare(String(a.createdAt||a.created))).map(f=>`<article class="feedback-card"><div class="row between wrap"><strong>${esc(f.reviewerName||'舊版未留姓名')} · ${esc(f.type)}</strong><small>${esc(f.created)}</small></div><small>${esc(f.caseName)} · ${esc(f.screen)} · ${esc(f.theme)} / ${esc(f.mode)}</small><p>${esc(f.opinion)}</p><div class="row between wrap spaced"><span class="pill ${remote||f.delivery==='shared'?'good':'warn'}">${remote?'共用資料夾紀錄':f.delivery==='shared'?'曾成功送出':'僅在本機・尚未分享'}</span>${!remote&&f.delivery!=='shared'&&f.app===F.app?btn('retry-feedback','送出這則回饋',`data-id="${esc(f.id)}" ${shared.busy?'disabled':''}`,'small'):''}</div></article>`).join(''):'<div class="empty">目前沒有紀錄。'+(remote?'連接共用資料夾後，按「更新大家的回饋」。':'可以先寫下你的操作意見。')+'</div>';}
function feedbackDialog(view='write'){
  captureFeedbackDraft();if(view===true)view='local';
  if(!ui.feedbackContext||!$('dialog').open)ui.feedbackContext={caseId:state.caseId,caseName:current().name,screen:tabNames[ui.tab],theme:names[state.prefs.theme],mode:state.prefs.mode};
  shared.view=view;const ctx=ui.feedbackContext,disabled=shared.busy?'disabled':'';
  let content=`<section class="notice" style="display:block"><strong>${shared.dir?'已連接：'+esc(shared.dir.name):'尚未連接共用回饋資料夾'}</strong><p class="muted" style="font-size:11px;margin:7px 0">請選公司共用的「${F.folderName}」資料夾。姓名與回饋會供同仁查閱；每則獨立存檔，不會寫進 HTML。</p><div class="row wrap">${btn('connect-feedback',icon('folder')+(shared.dir?'重新連接':'連接共用資料夾'),disabled,'small')}${btn('refresh-feedback','更新大家的回饋',disabled||(!shared.dir?'disabled':''),'small')}</div><p id="shared-status" role="status" style="font-size:11px;margin-top:8px">${esc(shared.message||'重新整理後請再次連接同一資料夾，才能送出與讀取最新留言。')}</p></section>`;
  content+=`<div class="row wrap" style="margin:18px 0">${btn('feedback','寫意見',disabled,'small '+(view==='write'?'primary':''))}${btn('feedback-shared',`大家的回饋 ${shared.rows.length}`,disabled,'small '+(view==='shared'?'primary':''))}${btn('feedback-list',`本機紀錄 ${state.feedback.length}`,disabled,'small '+(view==='local'?'primary':''))}</div>`;
  if(view==='shared')content+=`<p class="muted" style="font-size:11px;margin-bottom:12px">${shared.readAt?'上次讀取：'+esc(shared.readAt)+'。以下為上次成功讀取的紀錄，按更新取得最新意見。':'還沒讀取共用資料夾。'}</p>`+feedbackCards(shared.rows,true);
  else if(view==='local')content+=`<p class="muted" style="font-size:11px;margin-bottom:12px">只有這個瀏覽器的紀錄；「僅在本機」的意見尚未分享給其他人。</p>`+feedbackCards(state.feedback);
  else content+=`<div class="source-label">${esc(ctx.caseName)} · ${esc(ctx.screen)}<br>${esc(ctx.theme)} / ${ctx.mode==='dark'?'深色':'淺色'}</div><label for="reviewer-name" class="spaced">回饋者姓名 <span class="muted">必填</span></label><input id="reviewer-name" maxlength="60" required autocomplete="name" placeholder="請填寫姓名" value="${esc(shared.draft.reviewerName)}"><label class="spaced">想回饋哪個部分？</label><div class="feedback-types">${['操作流程','外觀可讀性','卷宗與紙本','其他'].map(t=>btn('feedback-type',t,`data-type="${t}" aria-pressed="${ui.feedbackType===t}"`,'small '+(ui.feedbackType===t?'active':''))).join('')}</div><label for="opinion" class="spaced">你的意見 <span class="muted">必填</span></label><textarea id="opinion" required maxlength="3000" placeholder="例如：我不確定移出卷宗後，原本的報價還在不在。">${esc(shared.draft.opinion)}</textarea><label for="difficulty" class="spaced">這次操作感受 <span class="muted">選填</span></label><select id="difficulty">${['','容易理解','需要一點摸索','需要他人說明'].map(v=>`<option value="${v}" ${shared.draft.difficulty===v?'selected':''}>${v||'先不評分'}</option>`).join('')}</select><div class="dialog-actions">${btn('save-local-feedback','僅存本機',disabled,'small')}${btn('save-feedback',icon('check')+'送出至共用資料夾',disabled,'primary')}</div>`;
  const rows=feedbackRows();content+=`${!storageOK?'<p class="storage-note spaced">本機暫存不可用，未送出的意見請匯出備份。</p>':''}<hr class="divider"><div class="row between wrap"><small>${view==='shared'?'匯出上次讀取的共用紀錄':'匯出本機紀錄'}；重設示範不刪除回饋。</small><div class="row">${btn('export-json','JSON',rows.length?'':'disabled','small')}${btn('export-csv','CSV',rows.length?'':'disabled','small')}</div></div>`;openDialog('使用意見與共用回饋',content);
}
function feedbackError(error){return error?.name==='AbortError'?'已取消選取，意見尚未送出。':error?.name==='NotAllowedError'||error?.name==='SecurityError'?'瀏覽器未允許讀寫。請用 Edge 開啟 HTML，重新選取共用資料夾並允許存取；若公司政策封鎖，請匯出備份並聯絡主持人。':'資料夾讀寫未完成：'+String(error?.message||error)+'。請確認 P 槽連線與權限，再重試。';}
async function loadShared(){const result=await F.read(shared.dir);shared.rows=result.records;shared.readAt=new Date().toLocaleString('zh-TW',{hour12:false});shared.message=`已讀取 ${shared.rows.length} 則共用回饋。${result.skipped?'略過 '+result.skipped+' 個無法辨識或尚未寫完的回饋檔，可稍後再更新。':''}`;try{localStorage.setItem(BOARD,JSON.stringify({folder:F.folderName,rows:shared.rows,readAt:shared.readAt}));}catch{shared.message+=' 本機無法保留這次快取；原回饋檔仍在資料夾。';}}
async function connectFeedback(){if(shared.busy)return;captureFeedbackDraft();shared.busy=true;try{
  if(typeof window.showDirectoryPicker!=='function')throw new Error('目前瀏覽器未提供資料夾選取功能，請改用公司 Edge');
  const directory=await window.showDirectoryPicker({id:'ws-uiux-feedback',mode:'readwrite'});
  if(directory.name!==F.folderName)throw new Error('請選取公司共用且名稱為「'+F.folderName+'」的專用資料夾');
  shared.dir=directory;await loadShared();
}catch(error){shared.message=feedbackError(error);}finally{shared.busy=false;feedbackDialog(shared.view);}}
async function refreshFeedback(){if(shared.busy||!shared.dir)return;captureFeedbackDraft();shared.busy=true;feedbackDialog(shared.view);try{await loadShared();}catch(error){shared.message=feedbackError(error)+' 畫面仍保留上次讀取的紀錄。';}finally{shared.busy=false;feedbackDialog(shared.view);}}
function newFeedback(){captureFeedbackDraft();const reviewerName=shared.draft.reviewerName.trim(),opinion=shared.draft.opinion.trim();if(!reviewerName){$('reviewer-name').focus();toast('請填寫回饋者姓名。');return null;}if(!opinion){$('opinion').focus();toast('請寫下你的使用意見。');return null;}return F.record({app:F.app,schema:1,...ui.feedbackContext,id:crypto.randomUUID(),createdAt:new Date().toISOString(),created:new Date().toLocaleString('zh-TW',{hour12:false}),reviewerName,opinion,difficulty:shared.draft.difficulty,type:ui.feedbackType});}
async function submitFeedback(send=true,retryId=null){
  if(shared.busy)return;
  if(send&&!shared.dir){shared.message='尚未送出：請先連接共用資料夾；目前輸入會暫存在此瀏覽器。';feedbackDialog(shared.view);return;}
  let f=retryId?state.feedback.find(x=>x.id===retryId):newFeedback();if(!f)return;
  if(!retryId){f={...f,delivery:'local'};state.feedback.push(f);persist();shared.draft={reviewerName:f.reviewerName,opinion:'',difficulty:''};if($('opinion'))$('opinion').value='';if($('difficulty'))$('difficulty').value='';try{localStorage.setItem(DRAFT,JSON.stringify(shared.draft));}catch{}}
  if(!send){renderSidebar();feedbackDialog('local');toast(storageOK?'已存本機，尚未分享給同仁。':'僅保留本次頁面，請立即匯出備份。');return;}
  shared.busy=true;shared.message='正在寫入共用資料夾，請稍候…';feedbackDialog('local');
  try{const saved=await F.write(shared.dir,f);const local=state.feedback.find(x=>x.id===f.id);if(local)local.delivery='shared';persist();shared.rows=[saved,...shared.rows.filter(x=>x.id!==saved.id)];shared.message='已寫入並核對共用回饋檔。';try{await loadShared();}catch(error){shared.message='這則意見已寫入並核對成功，但更新其他人的回饋失敗。'+feedbackError(error);}shared.view='shared';}
  catch(error){shared.message='未確認送出成功，已保留在本機紀錄，可用同一則重試。'+feedbackError(error);shared.view='local';}
  finally{shared.busy=false;renderSidebar();feedbackDialog(shared.view);}
}

function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function exportFeedback(format){const entries=feedbackRows();const stamp=new Date().toISOString().slice(0,10);if(format==='json')download(`WS-意見回饋-${stamp}.json`,JSON.stringify({demoVersion:'01',exportedAt:new Date().toISOString(),feedback:entries},null,2),'application/json;charset=utf-8');else{const keys=['created','reviewerName','caseName','screen','type','opinion','difficulty','theme','mode'];const rows=[['記錄時間','回饋者姓名','案例','畫面','類別','意見','操作感受','主題','明暗模式'],...entries.map(f=>keys.map(k=>f[k]))];download(`WS-意見回饋-${stamp}.csv`,'\ufeff'+rows.map(r=>r.map(M.csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');}toast(`已匯出 ${entries.length} 則意見，請保留下載檔案。`);}
const guideSteps=[['找到資料','點開左側文件的眼睛圖示，看看內容與來源脈絡。'],['試試更新情境','按上方「加入包裝更新草稿」或「加入會後紀錄示例」。'],['整理本次卷宗','把資料拖到中間，調整順序；試著移出一份歷史資料。'],['檢查紙本結果','插入手寫頁，查看目錄、頁次，再放大預覽。'],['保存並回饋','保存輸出版，切回舊版比較，最後留下你的使用意見。']];
function renderGuide(){if(ui.guide<0){$('guide-container').innerHTML='';return;}const [title,text]=guideSteps[ui.guide];$('guide-container').innerHTML=`<div class="guide-bar"><span class="guide-counter">${ui.guide+1}/5</span><div class="grow"><strong>${title}</strong><p>${text}</p></div>${btn('guide-prev','上一步',ui.guide===0?'disabled':'','small')}${btn('guide-next',ui.guide===4?'完成':'下一步','','small primary')}${btn('guide-close','退出','','small ghost guide-close')}</div>`;}
function caseInfo(){openDialog('關於這個示範案例',`<div class="callout">唯一目的：收集前端操作體驗的意見。</div><p class="spaced">這份 HTML 參考 示例客戶 B 9/1 來訪與 CASE A DEMO-001 報價的工作情境。展示內容、價格、人物和文件頁面經簡化或合成，沒有載入公司原始附件。</p><p class="spaced">CASE A 已完成兩輪報價，追加紙箱包裝更新版尚待提出。各檔案與輪次的實際對應未核對，畫面不代表正式報價紀錄。</p><p class="spaced">你可以自由拖拉、修改示例摘要、比較外觀及保存示範輸出版。頁碼依預製示例頁重新編排；不解析任意 Office 文件，也不連接任何正式平台。</p><div class="dialog-actions">${btn('template','下載 HTML 會議紀錄模板','','small')}${btn('reset-confirm','重置示範案件','','small')}${btn('close','開始體驗','','primary')}</div>`);}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action,id=el.dataset.id,cid=state.caseId;const edits=['include','exclude','up','down','sort','undo','handwriting','snapshot'];if(readonly()&&edits.includes(a)){toast('目前是已保存輸出版，請先回到草稿。');return;}
switch(a){
case 'theme':state.prefs.theme=el.dataset.theme;appearance();persist();break;
case 'mode':state.prefs.mode=el.dataset.mode;appearance();persist();break;
case 'toggle-sidebar':state.prefs.sidebarCollapsed=!state.prefs.sidebarCollapsed;sidebarLayout();persist();fitPaper();break;
case 'home':ui.tab='home';render();break;
case 'case':state.caseId=id;ui.tab='dossier';ui.output='draft';ui.page=1;ui.query='';ui.poolFilter='all';persist();render();break;
case 'nav':ui.tab=el.dataset.tab;render();break;
case 'case-info':caseInfo();break;
case 'close':closeDialog();break;
case 'filter':ui.poolFilter=el.dataset.filter;render();break;
case 'include':case 'exclude':update(s=>M.include(s,cid,id,a==='include'),a==='include'?'已納入本次卷宗':'已移出本次卷宗，原資料仍保留',a==='include'?id:null);if($('dialog').open)closeDialog();break;
case 'up':case 'down':{const at=current().order.indexOf(id);update(s=>M.move(s,cid,id,at+(a==='up'?-1:1)),'已調整卷宗順序',id);break;}
case 'sort':update(s=>M.edit(s,cid,c=>{M.remember(c,'↕ 已依事件建議排序');c.order.sort((a,b)=>c.docs.find(d=>d.id===a).event.localeCompare(c.docs.find(d=>d.id===b).event,'zh-Hant'));}),'已依事件排序，可繼續手動調整');break;
case 'undo':update(s=>M.undo(s,cid),'已復原上一步編排');break;
case 'handwriting':update(s=>M.handwriting(s,cid),'已加入手寫頁');ui.page=outputPages().length;render();break;
case 'scenario':update(s=>M.scenario(s,cid),cid==='cmw'?'已加入合成會後紀錄，請決定是否納入卷宗':'已加入包裝更新草稿，狀態仍是待提出');break;
case 'snapshot':{update(s=>M.snapshot(s,cid),'已保存示範輸出版，可在預覽上方切換回看');break;}
case 'draft':ui.output='draft';ui.page=1;render();break;
case 'document':showDocument(id);break;
case 'nav-source':closeDialog();ui.tab='overview';render();break;
case 'page-doc':ui.page=outputPages().find(p=>p.docId===id)?.number||1;render();break;
case 'prev-page':ui.page=Math.max(1,ui.page-1);render();break;
case 'next-page':ui.page=Math.min(outputPages().length,ui.page+1);render();break;
case 'toc':ui.page=2;render();break;
case 'expand':openDialog((readonly()?saved().label:'目前草稿')+' · '+outputPages().length+' 頁',`<div class="row between" style="margin-bottom:18px"><small>白紙預覽・示例內容</small>${btn('print',icon('print')+'列印卷宗','','small')}</div>${outputPages().map(p=>paper(p)).join('')}`,true);break;
case 'toggle-preview':ui.hidePreview=!ui.hidePreview;render();break;
case 'print':$('print-root').innerHTML=outputPages().map(p=>paper(p)).join('');if($('dialog').open)closeDialog();window.print();break;
case 'summary':summaryDialog();break;
case 'ignore-summary':closeDialog();toast('已略過，摘要維持待確認。');break;
case 'confirm-summary':{const value=$('summary-edit').value.trim();if(!value){$('summary-edit').focus();toast('請留下至少一段摘要。');break;}state=M.edit(state,cid,c=>{c.summary=value;c.confirmed=true;c.stale=false;});persist();closeDialog();render();toast('示例摘要已確認。');break;}
case 'feedback':feedbackDialog();break;
case 'feedback-list':feedbackDialog('local');break;
case 'feedback-shared':feedbackDialog('shared');break;
case 'connect-feedback':void connectFeedback();break;
case 'refresh-feedback':void refreshFeedback();break;
case 'save-local-feedback':void submitFeedback(false);break;
case 'retry-feedback':void submitFeedback(true,id);break;
case 'feedback-type':ui.feedbackType=el.dataset.type;document.querySelectorAll('[data-action="feedback-type"]').forEach(b=>{b.classList.toggle('active',b.dataset.type===ui.feedbackType);b.setAttribute('aria-pressed',String(b.dataset.type===ui.feedbackType));});break;
case 'save-feedback':void submitFeedback(true);break;
case 'export-json':exportFeedback('json');break;
case 'export-csv':exportFeedback('csv');break;
case 'guide':if(ui.tab==='home')ui.tab='dossier';ui.guide=0;render();break;
case 'guide-prev':ui.guide=Math.max(0,ui.guide-1);renderGuide();break;
case 'guide-next':if(ui.guide===4){ui.guide=-1;renderGuide();feedbackDialog();}else{ui.guide++;renderGuide();}break;
case 'guide-close':ui.guide=-1;renderGuide();break;
case 'files':$('local-files').click();break;
case 'reset-confirm':openDialog('重置示範案件',`<p>將恢復兩個案例的初始資料，移除本次新增案件、編排與示範輸出版。</p><div class="notice spaced">${icon('message')}已收集的 ${state.feedback.length} 則意見與外觀偏好會保留。</div><div class="dialog-actions">${btn('close','取消')}${btn('reset','重置案件','','primary')}</div>`);break;
case 'reset':state=M.reset(state);ui.output='draft';ui.page=1;ui.query='';ui.poolFilter='all';ui.tab='dossier';persist();closeDialog();render();toast('案件已重置，使用意見與外觀偏好已保留。');break;
case 'new-case':openDialog('建立示範案件',`<p class="muted">試試建案的操作負擔，內容只用於這份 Demo。</p><label for="new-name" class="spaced">案件名稱</label><input id="new-name" maxlength="48" placeholder="例如：客戶會議資料整理"><label for="new-customer" class="spaced">客戶／對象</label><input id="new-customer" maxlength="24" placeholder="例如：客戶 A"><div class="dialog-actions">${btn('close','取消')}${btn('create-case','建立示範案件','','primary')}</div>`);break;
case 'create-case':{const name=$('new-name').value.trim(),customer=$('new-customer').value.trim();if(!name||!customer){toast('請填寫案件名稱與客戶／對象。');(!name?$('new-name'):$('new-customer')).focus();break;}const newId='case-'+Date.now();state.cases[newId]={id:newId,code:'CUSTOM / DEMO',name,customer,type:'自訂示例',period:'本次體驗',status:'待整理',summary:'這是一個剛建立的示範案件。可以選取本機檔案資訊，或加入手寫補充頁體驗編排。',docs:[],order:[],defaultOrder:[],undo:[],changes:[],snapshots:[],confirmed:false,stale:false};state.caseId=newId;ui.tab='dossier';ui.output='draft';ui.page=1;persist();closeDialog();render();toast('示範案件已建立。');break;}
case 'expenses':openDialog('接待費用・合成示例',`<p class="muted">以下金額為示例，未讀取真實報銷資料。</p><dl class="key-value"><dt>餐敘費</dt><dd>NT$ 8,000</dd><dt>對應證明</dt><dd>收據示例 + 報銷單示例</dd><dt>本幣合計</dt><dd><strong>NT$ 8,000</strong></dd></dl><div class="notice">一筆費用有兩份證明，合計仍只算一次。</div><div class="dialog-actions">${btn('close','返回')}</div>`);break;
case 'download-weekly':download('WS-週報摘要-示例.txt',(current().id==='frdc'?'DEMO-001 委託生產：已完成兩輪報價；捆包變更、追加紙箱包裝的更新版尚待提出。':current().name+'：整理本次資料與卷宗。')+'\n\nUI/UX 討論用示例，非正式週報。','text/plain;charset=utf-8');break;
case 'template':download('WS-會議紀錄-列印模板.html','<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>會議紀錄列印模板</title><style>body{font:16px/2 "Microsoft JhengHei",sans-serif;margin:20mm}h1{font-size:26px}section{border-bottom:1px solid #bbb;min-height:50mm}@page{size:A4}</style><h1>會議紀錄</h1><p>日期：________________　地點：________________</p><p>與會人員：____________________________________</p><section><h2>議題與討論</h2></section><section><h2>決議事項</h2></section><section><h2>待辦／負責人／期限</h2></section></html>','text/html;charset=utf-8');toast('已下載真正的 HTML 列印模板。');break;
}});
document.addEventListener('input',e=>{if(e.target.id==='pool-search'){ui.query=e.target.value;$('pool-list').innerHTML=poolContent();}});
$('stage').addEventListener('change',e=>{if(e.target.id==='output-select'){ui.output=e.target.value;ui.page=1;render();}});
$('local-files').addEventListener('change',e=>{const files=Array.from(e.target.files).slice(0,10);if(!files.length)return;state=M.edit(state,state.caseId,c=>{files.forEach((f,i)=>c.docs.push({id:'local-'+Date.now()+'-'+i,title:f.name,filename:f.name,format:(f.name.split('.').pop()||'FILE').slice(0,7).toUpperCase(),event:'05 本機檔案資訊',date:'本次選取',status:'內容未保存',kinds:['local'],size:f.size,isNew:true}));});persist();ui.query='';ui.poolFilter='all';render();e.target.value='';toast('已加入 '+files.length+' 份檔案資訊；沒有保存或解析檔案內容。');});
document.addEventListener('dragstart',e=>{const card=e.target.closest('[data-drag-id]');if(!card||readonly()){e.preventDefault();return;}dragId=card.dataset.dragId;e.dataTransfer.effectAllowed='copyMove';e.dataTransfer.setData('text/plain','ws-demo:'+dragId);card.classList.add('dragging');});
document.addEventListener('dragover',e=>{const list=e.target.closest('#order-list');if(!list||readonly()||!dragId)return;e.preventDefault();e.dataTransfer.dropEffect=current().order.includes(dragId)?'move':'copy';list.classList.add('drop-target');document.querySelectorAll('.drop-before').forEach(x=>x.classList.remove('drop-before'));const target=e.target.closest('[data-order-id]');if(target&&target.dataset.orderId!==dragId)target.classList.add('drop-before');});
document.addEventListener('drop',e=>{const list=e.target.closest('#order-list');if(!list||readonly()||!dragId)return;e.preventDefault();const id=dragId,target=e.target.closest('[data-order-id]');const order=current().order.filter(x=>x!==id);const at=target?order.indexOf(target.dataset.orderId):order.length;if(target?.dataset.orderId!==id)update(s=>M.move(s,state.caseId,id,at<0?order.length:at),'已更新卷宗編排',id);clearDrag();});
function clearDrag(){dragId=null;document.querySelectorAll('.dragging,.drop-target,.drop-before').forEach(x=>x.classList.remove('dragging','drop-target','drop-before'));}
document.addEventListener('dragend',clearDrag);
$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const b=e.target.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)closeDialog();}});
$('dialog').addEventListener('close',()=>{captureFeedbackDraft();ui.feedbackContext=null;});
document.addEventListener('input',e=>{if(['reviewer-name','opinion','difficulty'].includes(e.target.id))captureFeedbackDraft();});
window.addEventListener('resize',fitPaper);
readStorage();appearance();render();
})();
</script>
