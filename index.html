  function csvCell(value){let s=String(value??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
  return {createState,copy,pages,edit,remember,include,move,handwriting,undo,scenario,snapshot,reset,csvCell};
})();

<script id="demo-feedback">
// One immutable file per submission; no shared read/modify/write aggregate.
globalThis.DemoFeedback=(()=>{
  const folderName='WS-UIUX-回饋',app='ws-uiux-feedback',pattern=/^ws-feedback-([0-9a-f-]{36})\.json$/;
  const limits={reviewerName:60,opinion:3000,caseId:100,caseName:200,screen:100,type:80,difficulty:100,theme:80,mode:20,created:100};
  function record(value){
    if(!value||value.app!==app||value.schema!==1||!pattern.test('ws-feedback-'+value.id+'.json')||!Number.isFinite(Date.parse(value.createdAt)))throw new Error('回饋格式不符');
    const result={app,schema:1,id:value.id,createdAt:value.createdAt};
    for(const [key,max] of Object.entries(limits)){if(typeof value[key]!=='string'||value[key].length>max)throw new Error('回饋欄位不符');result[key]=value[key];}
    if(!result.reviewerName.trim()||!result.opinion.trim())throw new Error('姓名與意見必填');
    return result;
  }
  async function read(dir){
    const records=[],seen=new Set();let skipped=0,visited=0;
    for await(const [name,handle] of dir.entries()){
      if(handle.kind!=='file'||!pattern.test(name))continue;
      if(++visited>2000)throw new Error('回饋檔案超過本次 Demo 可讀取的 2000 則，請主持人分批封存。');
      // I/O errors stop refresh; keep the last successful board instead of hiding rows.
      const file=await handle.getFile();if(file.size>64000){skipped++;continue;}
      const raw=await file.text();let value;
      try{value=record(JSON.parse(raw));if(name!=='ws-feedback-'+value.id+'.json'||seen.has(value.id))throw new Error('不符');}catch{skipped++;continue;}
      seen.add(value.id);records.push(value);
    }
    records.sort((a,b)=>b.createdAt.localeCompare(a.createdAt)||a.id.localeCompare(b.id));
    return {records,skipped};
  }
  async function write(dir,input){
    const value=record(input),name='ws-feedback-'+value.id+'.json',serialized=JSON.stringify(value,null,2);let handle;
    try{handle=await dir.getFileHandle(name);const file=await handle.getFile();if(file.size){
      const previous=record(JSON.parse(await file.text()));
      if(JSON.stringify(previous)!==JSON.stringify(value))throw new Error('同名回饋檔內容不同，未覆寫。');
      return value;
    }}catch(error){if(error.name!=='NotFoundError')throw error;}
    handle=handle||await dir.getFileHandle(name,{create:true});let stream;
    try{stream=await handle.createWritable();await stream.write(serialized);await stream.close();stream=null;}catch(error){if(stream)try{await stream.abort();}catch{}throw error;}
    const verified=record(JSON.parse(await (await handle.getFile()).text()));
    if(JSON.stringify(verified)!==JSON.stringify(value))throw new Error('寫入後核對失敗，請重新讀取確認。');
    return verified;
  }
  return {folderName,app,record,read,write};
})();
</script>
<script id="liquid-glass-controls">
/* Optional controls. No storage, network access or dependency on pointer lighting. */
(() => {
  'use strict';
  const defaults = Object.freeze({density:45, theme:'dark', background:'plain'});
  const mounted = new WeakMap();
  function normalize(settings = {}) {
    const density = (typeof settings.density === 'number' || typeof settings.density === 'string')
      && String(settings.density).trim() !== '' ? Number(settings.density) : NaN;
    return {
      density:Number.isFinite(density) ? Math.round(Math.max(0,Math.min(100,density))) : defaults.density,
      theme:settings.theme === 'light' ? 'light' : 'dark',
      background:settings.background === 'ambient' ? 'ambient' : 'plain'
    };
  }
  function apply(target, settings = defaults) {
    if (!target?.classList?.contains('lg-ui')) throw new TypeError('Target must be an .lg-ui element');
    const state = normalize(settings);
    target.style.setProperty('--lg-density',String(state.density / 100));
    target.dataset.lgTheme = state.theme;
    target.dataset.lgBackground = state.background;
    return {...state};
  }
  function mount(panel, target, options = {}) {
    if (mounted.has(panel)) return mounted.get(panel);
    let state = normalize(options.settings), disposed = false;
    const field = name => panel.querySelector('[data-lg-'+name+']');
    const density = field('density'), theme = field('theme'), background = field('background');
    function sync() {
      state = apply(target,state);
      panel.dataset && (panel.dataset.lgTheme = state.theme);
      if (density) density.value = String(state.density);
      if (theme) theme.value = state.theme;
      if (background) background.value = state.background;
      const output = field('density-output');
      if (output) output.textContent = state.density+'%';
      const exported = field('settings');
      if (exported) exported.value = JSON.stringify(state,null,2);
      options.onChange?.({...state});
    }
    function input(event) {
      if (event.target !== density || !density) return;
      state.density = density.value; sync();
    }
    function change(event) {
      if (event.target === theme && theme) state.theme = theme.value;
      else if (event.target === background && background) state.background = background.value;
      else return;
      sync();
    }
    function click(event) {
      const button = event.target.closest?.('[data-lg-reset], [data-lg-export]');
      if (!button || !panel.contains(button)) return;
      if (button.hasAttribute('data-lg-reset')) controller.reset();
      if (button.hasAttribute('data-lg-export')) {
        const output = field('settings');
        if (output) { output.hidden = false; output.focus(); output.select(); }
      }
    }
    const controller = {
      getSettings:() => ({...state}),
      setSettings(settings) { if (!disposed) { state = normalize({...state,...settings}); sync(); } },
      reset() { if (!disposed) { state = {...defaults}; sync(); } },
      dispose() {
        panel.removeEventListener('input',input); panel.removeEventListener('change',change);
        panel.removeEventListener('click',click); mounted.delete(panel); disposed = true;
      }
    };
    sync();
    panel.addEventListener('input',input); panel.addEventListener('change',change); panel.addEventListener('click',click);
    mounted.set(panel,controller);
    return controller;
  }
  window.LiquidGlassControls = Object.freeze({defaults,apply,mount});
})();

</script>

 }
 function topics(s,key){return week(s,key).order.map(id=>s.meeting.topics[id]).filter(Boolean);}

 function carry(s,key,ids){const added=[];for(const id of ids){const t=s.meeting.tasks[id];if(!t||t.status==='已完成'||t.createdWeek>=key||topics(s,key).some(x=>x.taskId===id))continue;added.push(addTopic(s,key,{title:t.title,owner:t.owner,caseId:t.caseId,category:'追蹤',taskId:id,internal:!!t.internal,source:'沿用任務 '+id,progress:t.updates[key]||'',question:'本週是否需要協調？'}));}return added;}

  return `週四全公司業務週會｜WS 單位提報草稿\n來源週次：${key}；暫定示範格式\n草稿・尚未送出；請主管人工檢查\n未帶入內部討論與決議原文；示範遮蔽非正式防護\n\n${rr.map((r,i)=>`${i+1}. ${r.title}\n本週重點進度：${r.progress||'待補'}${r.caseId?'；案件最新狀態：'+r.caseStatus:''}\n風險／待協調：待人工補充\n需主管決策：待人工補充\n下週計畫：${r.task?.title||'待人工補充'}\n來源：${r.caseName} / 議題 ${r.id}\n資料更新：${r.updatedAt}`).join('\n\n')||'尚未選取可提報議題'}`;
 }

 return {init,week,topics,addTopic,carry,priorUpdate,updateTask,taskFromTopic,rows,minuteRow,generate,stale,signature,confirm,toDossier,now,clone};
})();

function readStorage(){try{const raw=JSON.parse(localStorage.getItem(STORE)||'null');if(raw?.schema===1&&raw.cases?.frdc&&raw.cases?.cmw&&Array.isArray(raw.cases.frdc.docs)&&raw.cases[raw.caseId])state=raw;const feedback=JSON.parse(localStorage.getItem(FEEDBACK)||'[]');if(Array.isArray(feedback))state.feedback=feedback;}catch{storageOK=false;state=M.createState();}if(!names[state.prefs?.theme])state.prefs={theme:'mono',mode:'light'};if(!['light','dark'].includes(state.prefs.mode))state.prefs.mode='light';}
function persist(){try{localStorage.setItem(FEEDBACK,JSON.stringify(state.feedback));localStorage.setItem(STORE,JSON.stringify(state));}catch{storageOK=false;}}

function sidebarLayout(){const collapsed=state.prefs.sidebarCollapsed===true;document.documentElement.dataset.sidebar=collapsed?'collapsed':'expanded';const button=$('sidebar-toggle'),label=collapsed?'展開側邊欄':'收合側邊欄';button.setAttribute('aria-expanded',String(!collapsed));button.setAttribute('aria-label',label);button.title=label;button.innerHTML=`<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="${collapsed?'M9 6l6 6-6 6':'M15 6l-6 6 6 6'}"/></svg>`;}
function renderSidebar(){const c=current();$('case-shortcuts').innerHTML=Object.values(state.cases).map(x=>`<button class="case-shortcut ${ui.tab!=='home'&&ui.tab!=='meeting'&&c.id===x.id?'active':''}" data-action="case" data-id="${esc(x.id)}" title="${esc(x.customer)} · ${esc(x.name)}" aria-label="${esc(x.customer)} · ${esc(x.name)}"><span class="case-dot"></span><span class="case-icon" aria-hidden="true">${icon(x.id==='cmw'?'users':'folder')}</span><span class="case-copy"><strong>${esc(x.customer)} ${x.id==='frdc'?'DEMO-001':x.id==='cmw'?'9/1 來訪':'示範案件'}</strong><small>${esc(x.type)}</small></span></button>`).join('');$('nav-home').innerHTML=icon('grid')+'<span class="side-label">案件一覽</span>';$('nav-dossier').innerHTML=icon('book')+'<span class="side-label">卷宗編排</span>';$('nav-home').classList.toggle('active',ui.tab==='home');$('nav-dossier').classList.toggle('active',ui.tab==='dossier');$('guide-button').innerHTML=icon('play')+'操作導覽';$('feedback-button').innerHTML=icon('message')+`留下意見 <span style="opacity:.65">${state.feedback.length||''}</span>`;sidebarLayout();}
function renderHeader(){const c=current();if(ui.tab==='home'){$('case-head').innerHTML='';return;}const has=c.docs.some(d=>d.id===(c.id==='cmw'?'minutes':'pack'));$('case-head').innerHTML=`<div class="breadcrumb"><span>工作案例</span><span>›</span><span>${esc(c.customer)}</span><span class="mono" style="margin-left:auto">${esc(c.code)}</span></div><div class="case-title-row"><div><h1>${esc(c.name)}</h1><p class="subtitle">${esc(c.id==='frdc'?'兩輪報價，一條清楚的脈絡。下一步：追加紙箱包裝。':c.id==='cmw'?'從來訪準備到會後整理，讓資料自然形成一份卷宗。':'用一個簡單案例，試試資料與卷宗的操作方式。')}</p><div class="case-status"><span class="pill good">${icon('check')}${esc(c.type)}</span><span class="pill">${icon('clock')}${esc(c.period)}</span><span class="pill warn">${esc(c.status)}</span></div></div><div class="case-title-actions">${btn('scenario',icon('plus')+(c.id==='cmw'?'加入會後紀錄示例':'加入包裝更新草稿'),has||!['frdc','cmw'].includes(c.id)?'disabled':'','small')}${btn('case-info',icon('info'),'aria-label="案例與示範說明"','icon-btn')}</div></div><nav class="tabs" aria-label="案件檢視">${Object.entries(tabNames).filter(([k])=>k!=='home').map(([key,name])=>btn('nav',name,`data-tab="${key}" aria-current="${ui.tab===key?'page':'false'}"`,ui.tab===key?'active':'')).join('')}</nav>`;}

function filteredDocs(){return current().docs.filter(d=>(ui.poolFilter!=='pending'||!current().order.includes(d.id))&&(!ui.query||[d.title,d.filename,d.event].join(' ').toLowerCase().includes(ui.query.toLowerCase())));}

function renderBuilder(){const c=current(),pg=outputPages();ui.page=Math.min(Math.max(1,ui.page),pg.length);return `<div class="workspace-intro"><div class="row">${icon('book')}<strong>編好這次要帶走的資料</strong><span class="muted">${readonly()?'歷史輸出版・唯讀':'從左側挑選，拖動中間卡片調整順序。'}</span></div>${btn('toggle-preview',icon(ui.hidePreview?'eye':'expand')+(ui.hidePreview?'顯示預覽':'收合預覽'),'','small ghost')}</div><div class="builder-grid"><section class="panel"><div class="panel-heading"><h3><span class="step-number">01</span> 案件資料池</h3><span class="badge-count">${c.docs.length}</span></div><p class="panel-subtitle">資料保留在案件裡，按需放進卷宗。</p><div class="search-wrap">${icon('search')}<input id="pool-search" aria-label="搜尋案件資料" placeholder="搜尋文件、事件…" value="${esc(ui.query)}"></div><div class="panel-controls">${btn('filter','全部資料','data-filter="all" aria-pressed="'+(ui.poolFilter==='all')+'"','small filter-btn '+(ui.poolFilter==='all'?'active':''))}${btn('filter','尚未納入','data-filter="pending" aria-pressed="'+(ui.poolFilter==='pending')+'"','small filter-btn '+(ui.poolFilter==='pending'?'active':''))}</div><div class="pool-scroll" id="pool-list">${poolContent()}</div><div class="panel-footer"><span>示例文件・可拖拉</span>${btn('files',icon('plus')+'選取本機檔案',readonly()?'disabled':'','small ghost')}</div></section><section class="panel"><div class="panel-heading"><h3><span class="step-number">02</span> ${readonly()?'已保存編排':'本次卷宗'}</h3><span class="pill ${readonly()?'':'accent'}">${readonly()?'唯讀':'草稿'}</span></div><p class="panel-subtitle">${readonly()?'查看當時保存的內容與排列。':'移出卷宗不會刪除原始資料。'}</p><div class="panel-controls">${btn('sort',icon('clock')+'依事件排序',readonly()?'disabled':'','small')}${btn('undo',icon('undo'),'aria-label="復原上一步編排" title="復原上一步編排" '+(readonly()||!c.undo.length?'disabled':''),'small')}${readonly()?btn('draft','回到草稿','','small primary'):''}</div><div class="order-scroll" id="order-list">${renderOrder()}</div><div class="changes">${c.changes.length?`<strong>${esc(c.changes[0])}</strong>`:'拖動卡片，看看 function captureFeedbackDraft(){if(!$('opinion'))return;shared.draft={reviewerName:$('reviewer-name').value,opinion:$('opinion').value,difficulty:$('difficulty').value};try{localStorage.setItem(DRAFT,JSON.stringify(shared.draft));}catch{}}
function feedbackRows(){return shared.view==='shared'?shared.rows:state.feedback;}
function feedbackCards(rows,remote=false){return rows.length?rows.slice().sort((a,b)=>String(b.createdAt||b.created).localeCompare(String(a.createdAt||a.created))).map(f=>`<article class="feedback-card"><div class="row between wrap"><strong>${esc(f.reviewerName||'舊版未留姓名')} · ${esc(f.type)}</strong><small>${esc(f.created)}</small></div><small>${esc(f.caseName)} · ${esc(f.screen)} · ${esc(f.theme)} / ${esc(f.mode)}</small><p>${esc(f.opinion)}</p><div class="row between wrap spaced"><span class="pill ${remote||f.delivery==='shared'?'good':'warn'}">${remote?'共用資料夾紀錄':f.delivery==='shared'?'曾成功送出':'僅在本機・尚未分享'}</span>${!remote&&f.delivery!=='shared'&&f.app===F.app?btn('retry-feedback','送出這則回饋',`data-id="${esc(f.id)}" ${shared.busy?'disabled':''}`,'small'):''}</div></article>`).join(''):'<div class="empty">目前沒有紀錄。'+(remote?'連接共用資料夾後，按「更新大家的回饋」。':'可以先寫下你的操作意見。')+'</div>';}
function feedbackDialog(view='write'){
  captureFeedbackDraft();if(view===true)view='local';
  if(!ui.feedbackContext||!$('dialog').open)ui.feedbackContext={caseId:state.caseId,caseName:ui.tab==='meeting'?'WS 週會 '+wk():current().name,screen:ui.tab==='meeting'?'WS 週會工作台 · '+({agenda:'本週議程',tasks:'決議待辦',outputs:'紀錄提報'}[wu.tab]):tabNames[ui.tab],theme:names[state.prefs.theme],mode:state.prefs.mode};
  shared.view=view;const ctx=ui.feedbackContext,disabled=shared.busy?'disabled':'';
  let content=`<section class="notice" style="display:block"><strong>${shared.dir?'已連接：'+esc(shared.dir.name):'尚未連接共用回饋資料夾'}</strong><p class="muted" style="font-size:11px;margin:7px 0">請選公司共用的「${F.folderName}」資料夾。姓名與回饋會供同仁查閱；每則獨立存檔，不會寫進 HTML。</p><div class="row wrap">${btn('connect-feedback',icon('folder')+(shared.dir?'重新連接':'連接共用資料夾'),disabled,'small')}${btn('refresh-feedback','更新大家的回饋',disabled||(!shared.dir?'disabled':''),'small')}</div><p id="shared-status" role="status" style="font-size:11px;margin-top:8px">${esc(shared.message||'重新整理後請再次連接同一資料夾，才能送出與讀取最新留言。')}</p></section>`;
  content+=`<div class="row wrap" style="margin:18px 0">${btn('feedback','寫意見',disabled,'small '+(view==='write'?'primary':''))}${btn('feedback-shared',`大家的回饋 ${shared.rows.length}`,disabled,'small '+(view==='shared'?'primary':''))}${btn('feedback-list',`本機紀錄 ${state.feedback.length}`,disabled,'small '+(view==='local'?'primary':''))}</div>`;
  if(view==='shared')content+=`<p class="muted" style="font-size:11px;margin-bottom:12px">${shared.readAt?'上次讀取：'+esc(shared.readAt)+'。以下為上次成功讀取的紀錄，按更新取得最新意見。':'還沒讀取共用資料夾。'}</p>`+feedbackCards(shared.rows,true);
  else if(view==='local')content+=`<p class="muted" style="font-size:11px;margin-bottom:12px">只有這個瀏覽器的紀錄；「僅在本機」的意見尚未分享給其他人。</p>`+feedbackCards(state.feedback);
  else content+=`<div class="source-label">${esc(ctx.caseName)} · ${esc(ctx.screen)}<br>${esc(ctx.theme)} / ${ctx.mode==='dark'?'深色':'淺色'}</div><label for="reviewer-name" class="spaced">回饋者姓名 <span class="muted">必填</span></label><input id="reviewer-name" maxlength="60" required autocomplete="name" placeholder="請填寫姓名" value="${esc(shared.draft.reviewerName)}"><label class="spaced">想回饋哪個部分？</label><div class="feedback-types">${['操作流程','外觀可讀性','卷宗與紙本','其他'].map(t=>btn('feedback-type',t,`data-type="${t}" aria-pressed="${ui.feedbackType===t}"`,'small '+(ui.feedbackType===t?'active':''))).join('')}</div><label for="opinion" class="spaced">你的意見 <span class="muted">必填</span></label><textarea id="opinion" required maxlength="3000" placeholder="例如：我不確定移出卷宗後，原本的報價還在不在。">${esc(shared.draft.opinion)}</textarea><label for="difficulty" class="spaced">這次操作感受 <span class="muted">選填</span></label><select id="difficulty">${['','容易理解','需要一點摸索','需要他人說明'].map(v=>`<option value="${v}" ${shared.draft.difficulty===v?'selected':''}>${v||'先不評分'}</option>`).join('')}</select><div class="dialog-actions">${btn('save-local-feedback','僅存本機',disabled,'small')}${btn('save-feedback',icon('check')+'送出至共用資料夾',disabled,'primary')}</div>`;
  const rows=feedbackRows();content+=`${!storageOK?'<p class="storage-note spaced">本機暫存不可用，未送出的意見請匯出備份。</p>':''}<hr class="divider"><div class="row between wrap"><small>${view==='shared'?'匯出上次讀取的共用紀錄':'匯出本機紀錄'}；重設示範不刪除回饋。</small><div class="row">${btn('export-json','JSON',rows.length?'':'disabled','small')}${btn('export-csv','CSV',rows.length?'':'disabled','small')}</div></div>`;openDialog('使用意見與共用回饋',content);
}
function feedbackError(error){return error?.name==='AbortError'?'已取消選取，意見尚未送出。':error?.name==='NotAllowedError'||error?.name==='SecurityError'?'瀏覽器未允許讀寫。請用 Edge 開啟 HTML，重新選取共用資料夾並允許存取；若公司政策封鎖，請匯出備份並聯絡主持人。':'資料夾讀寫未完成：'+String(error?.message||error)+'。請確認 P 槽連線與權限，再重試。';}
async function loadShared(){const result=await F.read(shared.dir);shared.rows=result.records;shared.readAt=new Date().toLocaleString('zh-TW',{hour12:false});shared.message=`已讀取 ${shared.rows.length} 則共用回饋。${result.skipped?'略過 '+result.skipped+' 個無法辨識或尚未寫完的回饋檔，可稍後再更新。':''}`;try{localStorage.setItem(BOARD,JSON.stringify({folder:F.folderName,rows:shared.rows,readAt:shared.readAt}));}catch{shared.message+=' 本機無法保留這次快取；原回饋檔仍在資料夾。';}}
async function connectFeedback(){if(shared.busy)return;captureFeedbackDraft();shared.busy=true;try{
  if(typeof window.showDirectoryPicker!=='function')throw new Error('目前瀏覽器未提供資料夾選取功能，請改用公司 Edge');
  const directory=await window.showDirectoryPicker({id:'ws-uiux-feedback',mode:'readwrite'});
  if(directory.name!==F.folderName)throw new Error('請選取公司共用且名稱為「'+F.folderName+'」的專用資料夾');

}catch(error){shared.message=feedbackError(error);}finally{shared.busy=false;feedbackDialog(shared.view);}}

async function submitFeedback(send=true,retryId=null){
  if(shared.busy)return;

  let f=retryId?state.feedback.find(x=>x.id===retryId):newFeedback();if(!f)return;
  if(!retryId){f={...f,delivery:'local'};state.feedback.push(f);persist();shared.draft={reviewerName:f.reviewerName,opinion:'',difficulty:''};if($('opinion'))$('opinion').value='';if($('difficulty'))$('difficulty').value='';try{localStorage.setItem(DRAFT,JSON.stringify(shared.draft));}catch{}}
  if(!send){renderSidebar();feedbackDialog('local');toast(storageOK?'已存本機，尚未分享給同仁。':'僅保留本次頁面，請立即匯出備份。');return;}
  shared.busy=true;shared.message='正在寫入共用資料夾，請稍候…';feedbackDialog('local');
  try{const saved=await F.write(shared.dir,f);const local=state.feedback.find(x=>x.id===f.id);if(local)local.delivery='shared';persist();shared.rows=[saved,...shared.rows.filter(x=>x.id!==saved.id)];shared.message='已寫入並核對共用回饋檔。';try{await loadShared();}catch(error){shared.message='這則意見已寫入並核對成功，但更新其他人的回饋失敗。'+feedbackError(error);}shared.view='shared';}
  catch(error){shared.message='未確認送出成功，已保留在本機紀錄，可用同一則重試。'+feedbackError(error);shared.view='local';}
  finally{shared.busy=false;renderSidebar();feedbackDialog(shared.view);}
}

 openDialog(kind==='email'?(draft.localMail?'本機郵件 · 建立議題':'載入郵件 · 示範 RFQ'):kind==='reference'?'引用案件與附件':'新增一般議題',`${kind==='email'?`<div class="wm-source" id="wm-mail-source"><div class="wm-actions" style="margin:0 0 14px">${wb('msg-pick','選取本機 .msg','','primary')}${draft.localMail?wb('msg-demo','改用示範郵件'):''}</div><p class="wm-note">選取後讀取主旨並帶入卡片，可改標題及註記；不傳送檔案、不解析信件內文或附件內容。</p>${draft.localMail?localMailCard(draft.localMail):`<div class="wm-source spaced"><span class="format">RFQ示例.msg</span><h3>${esc(mail.subject)}</h3><p>${esc(mail.sent)}<br>${esc(mail.from)}</p><p>${esc(mail.body)}</p><div class="row wrap">${mail.attachments.map(a=>`<span class="pill">${esc(a)}</span>`).join('')}</div><p class="wm-note">預載示範資料，未解析真實 .msg。</p></div>`}</div>`:'<p class="wm-note">只建立來源關聯，不複製案件。</p>'}<div class="wm-form" data-w-form="new">${wf('title','議題標題（必填）',draft.title)}${ws('owner','負責人',draft.owner,owners)}${ws('category','類別',draft.category,['情報共有','需討論','追蹤'])}${ws('caseId','關聯案件',draft.caseId,[...linkedCases(),['new','＋ 模擬新增 RFQ 案件']])}${wf('newCaseName','新案件名稱（選新增時填）',draft.newCaseName||'RFQ 包裝詢價示例','text',true)}${wf('progress','本週進度',draft.progress,'textarea',true)}${wf('question','待討論問題',draft.question,'textarea',true)}${wf('note','卡片註記（加入後仍可修改）',draft.note||'','textarea',true)}<label class="wm-check full"><input data-w-field="internal" type="checkbox" ${draft.internal?'checked':''}>僅部門內部</label></div><details class="spaced" id="wm-attach-select"><summary>選擇關聯附件（不複製原件）</summary>${attachmentChoices(draft.caseId)}</details><div class="dialog-actions">${wb('dismiss','取消（保留輸入）')}${wb('add-topic','加入 '+wk()+' 議程',`data-kind="${kind}"`,'primary')}</div>`);wu.mail=mail;$('dialog').scrollTop=0;
}
function attachmentChoices(caseId){return (state.cases[caseId]?.docs||[]).map(d=>`<label class="wm-check spaced"><input type="checkbox" data-attach="${esc(d.id)}" ${state.meeting.newTopicDraft?.attachmentIds?.includes(d.id)?'checked':''}>${esc(d.title)}</label>`).join('')||'<p class="wm-note">沒有可引用的既有附件。</p>';}
function carryDialog(){const list=Object.values(state.meeting.tasks).filter(t=>t.createdWeek<wk()&&t.status!=='已完成');openDialog('帶入前週未完成追蹤',`<p class="wm-note">勾選後沿用原任務，不改原期限；完成項不自動重開。</p>${list.map(t=>{const exists=W.topics(state,wk()).some(x=>x.taskId===t.id);return `<div class="wm-source spaced"><label class="wm-check"><input type="checkbox" data-carry="${t.id}" ${exists?'disabled':'checked'}><strong>${esc(t.title)} ${exists?'（本週已有）':''}</strong></label><p>原期限：${esc(t.originalDue||'待確認')} · ${esc(t.owner||'待確認')}<br>上次進度：${esc(W.priorUpdate(t,wk()))}</p></div>`;}).join('')||'<div class="wm-empty">沒有可帶入的未完成項目。</div>'}<div class="dialog-actions">${wb('dismiss','返回')}${wb('carry-confirm','帶入所選項目','','primary')}</div>`);}
function taskDialog(id){const t=state.meeting.tasks[id];if(!t)return;openDialog('更新待辦 · '+t.id,`<p class="wm-note">原期限：${esc(t.originalDue||'待確認')}；本次更新歸在 ${wk()}。此處調整的是同一筆任務。</p><div class="wm-form spaced" data-w-form="task" data-id="${t.id}">${wf('title','任務',t.title,'text',true)}${ws('owner','責任人',t.owner,owners)}${ws('status','目前狀態',t.status,['待處理','進行中','待協調','已完成'])}${wf('due','目前期限（可人工調整）',t.due,'date')}${wf('progress','本週進度',t.updates[wk()]||'','textarea',true)}</div><details class="spaced"><summary>跨週更新紀錄</summary>${Object.entries(t.updates).map(([k,p])=>`<p>${esc(k)}：${esc(p)}</p>`).join('')}</details><div class="dialog-actions">${wb('task-done','保存並返回','','primary')}</div>`);}
function scheduleDialog(){const w=ww();openDialog('示範改期與輪值',`<p class="wm-note">只修改本次示範會議，不建立真實行事曆或排程。</p><div class="wm-form spaced" data-w-form="schedule">${wf('date','會議日期時間',w.date,'datetime-local',true)}${ws('host','主持人',w.host,['主持人',...roles.slice(0,5)])}${ws('clerk','輪值值日生',w.clerk,roles.slice(0,5))}</div><div class="dialog-actions">${wb('schedule-done','保存並返回','','primary')}</div>`);}
function caseProgressDialog(id){const c=state.cases[id];openDialog('模擬週二／三更新案件',`<p class="wm-note">填寫最新進度，再回到週四提報重新整理；已確認週一紀錄保留原樣。</p><div class="wm-form spaced" data-w-form="case" data-id="${esc(id)}">${wf('status','案件最新狀態',c.status,'text',true)}${wf('summary','案件工作摘要',c.summary,'textarea',true)}</div><div class="dialog-actions">${wb('case-done','保存並返回','','primary')}</div>`);}
function resetWeeklyDialog(){openDialog('重設本次 v2.0 示範',`<p>只恢復此版的合成案件、週會、任務、草稿與版本。這些本機練習內容會被移除，請先下載要保留的輸出。</p><p class="spaced">舊版 HTML／舊版草稿、已收集回饋與外觀偏好均保留。</p><div class="dialog-actions">${wb('dismiss','取消')}${wb('reset-v2','確認重設此版','','primary')}</div>`);}
function switchWeek(delta){const d=new Date(wk()+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+delta*7);state.meeting.active=d.toISOString().slice(0,10);W.week(state,wk());wu.selected=null;wu.projection=false;wt();render();}
function showOutputText(title,text,downloadName){openDialog(title,`<pre class="wm-pre">${esc(text)}</pre><div class="dialog-actions">${wb('dismiss','返回')}${wb('download-view','下載此份文字','','primary')}</div>`,true);wu.viewText=text;wu.viewName=downloadName;}
function dossierDialog(versionId,caseId){const v=ww().versions.minutes.find(x=>x.id===versionId);if(!v)return;const caseIds=[...new Set(v.rows.map(r=>r.caseId).filter(Boolean))];const cid=caseId||caseIds[0];openDialog('選擇本案要納入的紀錄片段',`<p class="wm-note">來源為已確認紀錄 v${v.number} 的議題快照；會議全文的人工文字不會自動拆分至案件。請核對下列片段，可回到議題更正後另存版本。</p><label class="spaced">案件<select id="wm-dossier-case" data-version="${v.id}">${caseIds.map(id=>`<option value="${esc(id)}" ${cid===id?'selected':''}>${esc(state.cases[id]?.name)}</option>`).join('')}</select></label>${v.rows.filter(r=>r.caseId===cid).map(r=>`<div class="wm-source spaced"><label class="wm-check"><input type="checkbox" data-dossier-row="${r.id}" checked><strong>${esc(r.title)}</strong></label><pre class="wm-pre">${esc(W.minuteRow(r))}</pre></div>`).join('')||'<p>本份紀錄沒有關聯案件片段。</p>'}<p class="wm-note">只加入所選案件的草稿；原已保存卷宗保持原樣。片段頁數為示範估算。</p><div class="dialog-actions">${wb('dismiss','取消')}${wb('dossier-confirm','納入並前往卷宗',`data-version="${v.id}" ${cid?'':'disabled'}`,'primary')}</div>`,true);}
function renderKeepFocus(){const action=document.activeElement?.dataset.w,id=document.activeElement?.dataset.id;render();if(action){const candidate=[...document.querySelectorAll('[data-w]')].find(e=>e.dataset.w===action&&e.dataset.id===id);candidate?.focus();}}
document.addEventListener('input',e=>{
 const target=e.target,field=target.dataset.wField,form=target.closest('[data-w-form]');
 if(target.id==='wm-draft'){const d=ww().drafts[wu.output];d.text=target.value;d.manual=true;wt();return;}
 if(!field||!form)return;const value=target.type==='checkbox'?target.checked:target.value;const kind=form.dataset.wForm;
 if(kind==='topic'){const t=state.meeting.topics[form.dataset.id];t[field]=value;t.updatedAt=W.now();if(field==='progress'&&t.taskId)W.updateTask(state,t.taskId,wk(),{progress:value});if(field==='internal'&&value)ww().reportIds=ww().reportIds.filter(id=>id!==t.id);}
 if(kind==='task')W.updateTask(state,form.dataset.id,wk(),{[field]:value});
 if(kind==='schedule')ww()[field]=value;
 if(kind==='case'){state.cases[form.dataset.id][field]=value;state.cases[form.dataset.id].weeklyUpdatedAt=W.now();}
 if(kind==='new'){state.meeting.newTopicDraft[field]=value;if(field==='caseId')$('wm-attach-select').innerHTML='<summary>選擇關聯附件（不複製原件）</summary>'+attachmentChoices(value);}
 wt();
});
document.addEventListener('change',e=>{const el=e.target;
 if(el.id==='wm-week'){state.meeting.active=el.value;wu.selected=null;wu.projection=false;wt();render();}
 if(el.id==='wm-role'){state.meeting.role=el.value;wt();render();}
 if(el.dataset.reportSelect){const id=el.dataset.reportSelect;ww().reportIds=ww().reportIds.filter(x=>x!==id);if(el.checked&&!state.meeting.topics[id].internal)ww().reportIds.push(id);wt();render();}
 if(el.id==='wm-dossier-case')dossierDialog(el.dataset.version,el.value);
});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-w]');if(!el||el.disabled)return;const a=el.dataset.w,id=el.dataset.id;
 try{switch(a){
 case 'open':ui.tab='meeting';wu.projection=false;render();break;
 case 'tab':wu.tab=el.dataset.tab;render();break;
 case 'prev-week':switchWeek(-1);break;
 case 'next-week':switchWeek(1);break;
 case 'schedule':scheduleDialog();break;
 case 'schedule-done':if(!ww().date){toast('請設定示範日期時間');break;}closeDialog();render();toast('已更新本機示範會議');break;
 case 'select':wu.tab='agenda';wu.selected=id;render();$('wm-topic-editor')?.scrollIntoView({block:'nearest'});break;
 case 'topic-up':case 'topic-down':{const arr=ww().order,i=arr.indexOf(id),j=i+(a==='topic-up'?-1:1);if(j>=0&&j<arr.length)[arr[i],arr[j]]=[arr[j],arr[i]];wt();renderKeepFocus();break;}
 case 'exclude':state.meeting.topics[id].excluded=!state.meeting.topics[id].excluded;wt();renderKeepFocus();break;
 case 'reference':topicDialog('reference');break;
 case 'general':topicDialog('general');break;
 case 'email':topicDialog('email');break;
 case 'msg-pick':$('wm-msg-file').click();break;
 case 'msg-demo':{const d=state.meeting.newTopicDraft;delete d.localMail;d.title='RFQ｜追加紙箱包裝';wt();topicDialog('email');break;}
 case 'add-topic':{if(msgBusy){toast('正在讀取主旨，請稍候');break;}const d=state.meeting.newTopicDraft;if(!d.title.trim()){toast('請填寫議題標題');document.querySelector('[data-w-form="new"] [data-w-field="title"]').focus();break;}let cid=d.caseId;if(cid==='new'){if(!d.newCaseName?.trim()){toast('請填寫新案件名稱');break;}cid='case-weekly-'+(++state.meeting.sequence);state.cases[cid]={id:cid,code:'RFQ / DEMO',name:d.newCaseName,customer:'示例客戶',type:'報價案件',period:wk(),status:'RFQ 待確認',summary:d.progress||'合成詢價資料待整理',docs:[],order:[],defaultOrder:[],undo:[],changes:[],snapshots:[],confirmed:false,stale:false};}
 const data={...d,caseId:cid,source:d.localMail?'本機 .msg 主旨':d.kind==='email'?'示範 RFQ 郵件':d.kind==='reference'?'引用案件':'一般情報（合成）',attachmentIds:[...document.querySelectorAll('[data-attach]:checked')].map(x=>x.dataset.attach)};if(d.kind==='email'&&!d.localMail)data.mail=wu.mail;const t=W.addTopic(state,wk(),data);wu.selected=t.id;state.meeting.newTopicDraft=null;wt();closeDialog();render();toast('已加入議程，可繼續補充或排序');break;}
 case 'dismiss':closeDialog();break;
 case 'carry':carryDialog();break;
 case 'carry-confirm':{const ids=[...document.querySelectorAll('[data-carry]:checked')].map(x=>x.dataset.carry);const n=W.carry(state,wk(),ids).length;wt();closeDialog();render();toast(`已帶入 ${n} 項；同一任務不重複新增`);break;}
 case 'start':{const topics=W.topics(state,wk()).filter(t=>!t.excluded);if(!topics.length){toast('請先加入議題');break;}wu.returnScroll=window.scrollY;wu.projection=true;wu.tab='agenda';if(!topics.some(t=>t.id===wu.selected))wu.selected=topics[0].id;ww().status='會議進行中';wt();render();window.scrollTo(0,0);break;}
 case 'stop':wu.projection=false;ww().status=ww().versions.minutes.length?'紀錄已確認':'待整理紀錄';wt();render();window.scrollTo(0,wu.returnScroll);break;
 case 'previous-topic':case 'next-topic':{const ts=W.topics(state,wk()).filter(t=>!t.excluded),at=ts.findIndex(t=>t.id===wu.selected),next=Math.max(0,Math.min(ts.length-1,at+(a==='next-topic'?1:-1)));wu.selected=ts[next]?.id;render();break;}
 case 'save-topic':if(!activeTopic().title.trim()){toast('議題標題不可空白');break;}wt();renderKeepFocus();toast('本次紀錄已'+(storageOK?'保存於本機示範':'暫存於此頁'));break;
 case 'create-task':{const t=activeTopic();if(!t.decision.trim()){toast('請先填寫決議');document.querySelector('[data-w-field="decision"]').focus();break;}openDialog('由決議建立待辦',`<p>${esc(t.next||t.decision)}</p><p class="spaced">責任人：${esc(t.responsible||'待確認')} · 期限：${esc(t.due||'待確認')}</p><p class="wm-note spaced">只有確認此步驟才建立任務。單純保存決議不會增加任務。</p><div class="dialog-actions">${wb('dismiss','只保留決議')}${wb('task-create-confirm','建立一項待辦',`data-id="${t.id}"`,'primary')}</div>`);break;}
 case 'task-create-confirm':W.taskFromTopic(state,id);wt();closeDialog();render();toast('已建立關聯待辦，可跨週沿用');break;
 case 'task-edit':taskDialog(id);break;
 case 'task-done':closeDialog();render();toast('同一筆待辦已更新');break;
 case 'task-filter':wu.filter=el.dataset.filter;render();break;
 case 'clear-case-filter':wu.caseFilter='';render();break;
 case 'go-output':wu.projection=false;wu.tab='outputs';wu.output='minutes';render();break;
 case 'case-open':state.caseId=el.dataset.case;ui.tab='overview';ui.output='draft';wu.projection=false;wt();render();break;
 case 'attachment':state.caseId=el.dataset.case;showDocument(id);break;
 case 'case-progress':caseProgressDialog(el.dataset.case);break;
 case 'case-done':closeDialog();render();toast('案件最新進度已更新；可回週會檢查草稿');break;
 case 'output-type':wu.output=el.dataset.kind;render();break;
 case 'report-up':case 'report-down':{const arr=ww().reportIds,i=arr.indexOf(id),j=i+(a==='report-up'?-1:1);if(i>=0&&j>=0&&j<arr.length)[arr[i],arr[j]]=[arr[j],arr[i]];wt();renderKeepFocus();break;}
 case 'generate':if(ww().drafts[wu.output]?.manual){openDialog('重新整理前，保留人工修改',`<p>目前草稿含人工修改。你可以保留原稿繼續編輯；或先保存原稿備份，再取用最新來源重產。</p><div class="dialog-actions">${wb('dismiss','保留原稿，不重產')}${wb('generate-replace','備份人工稿並重新產生','','primary')}</div>`);}else{W.generate(state,wk(),wu.output);wt();render();}break;
 case 'generate-replace':W.generate(state,wk(),wu.output,true);wt();closeDialog();render();toast('原稿已保留在下方保留稿');break;
 case 'preview-draft':showOutputText('預覽 · '+(wu.output==='minutes'?'會議紀錄':'WS 提報草稿'),ww().drafts[wu.output].text,`WS-${wk()}-${wu.output}-草稿.txt`);break;
 case 'confirm-draft':{const v=W.confirm(state,wk(),wu.output);wt();render();toast(`已保存示範版本 v${v.number}${wu.output==='report'?'，尚未送出':''}`);break;}
 case 'download-draft':download(`WS-${wk()}-${wu.output}-草稿.txt`,ww().drafts[wu.output].text,'text/plain;charset=utf-8');break;
 case 'copy-draft':try{await navigator.clipboard.writeText(ww().drafts[wu.output].text);toast('已複製當下草稿文字');}catch{openDialog('請手動複製',`<p>此瀏覽器未允許自動複製，請選取下方文字後按 Ctrl+C。</p><textarea id="wm-copy" class="wm-editor">${esc(ww().drafts[wu.output].text)}</textarea>`);$('wm-copy').select();}break;
 case 'print-draft':$('print-root').innerHTML=`<pre class="wm-pre">${esc(ww().drafts[wu.output].text)}</pre>`;document.body.classList.add('wm-print');window.print();break;
 case 'version':{const v=ww().versions[wu.output].find(v=>v.id===id);showOutputText('當時快照 v'+v.number+(wu.output==='report'?' · 尚未送出':''),v.text,`WS-${wk()}-${wu.output}-v${v.number}.txt`);break;}
 case 'backup':{const b=ww().backups[+el.dataset.index];showOutputText('保留原稿',b.text,`WS-${wk()}-保留稿.txt`);break;}
 case 'download-view':download(wu.viewName,wu.viewText,'text/plain;charset=utf-8');break;
 case 'dossier-select':dossierDialog(id);break;
 case 'dossier-confirm':{const cid=$('wm-dossier-case').value,ids=[...document.querySelectorAll('[data-dossier-row]:checked')].map(x=>x.dataset.dossierRow);if(!ids.length){toast('請選擇至少一項相關內容');break;}const n=W.toDossier(state,wk(),el.dataset.version,cid,ids);state.caseId=cid;ui.tab='dossier';ui.output='draft';ui.page=1;wt();closeDialog();render();toast(`已加入 ${n} 個本案片段，原保存卷宗保持不變`);break;}
 case 'reset-dialog':resetWeeklyDialog();break;
 case 'reset-v2':state=M.reset(state);W.init(state);wu.selected=null;wu.projection=false;wu.tab='agenda';wu.output='minutes';ui.tab='meeting';wt();closeDialog();render();toast('已重設此版示範，回饋與舊版資料保留');break;
 }}catch(error){toast(error.message||'操作未完成，請檢查輸入');}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&wu.projection&&!$('dialog').open){e.preventDefault();document.querySelector('[data-w="stop"]')?.click();}});
window.addEventListener('afterprint',()=>document.body.classList.remove('wm-print'));
const nav=document.createElement('button');nav.id='wm-nav';nav.dataset.w='open';nav.title='WS 週會工作台';nav.setAttribute('aria-label','WS 週會工作台');nav.innerHTML=icon('users')+'<span class="side-label">WS 週會工作台</span>';document.querySelector('.side-nav').prepend(nav);
const mobile=document.createElement('button');mobile.className='small wm-mobile-entry';mobile.dataset.w='open';mobile.textContent='週會工作台';document.querySelector('.topbar-actions').prepend(mobile);
const reset=document.createElement('button');reset.className='small ghost';reset.dataset.w='reset-dialog';reset.textContent='重設本次示範';document.querySelector('.side-bottom').append(reset);
const msgInput=document.createElement('input');msgInput.type='file';msgInput.accept='.msg';msgInput.id='wm-msg-file';msgInput.hidden=true;msgInput.setAttribute('aria-label','選取本機 Outlook MSG 檔');document.body.append(msgInput);msgInput.addEventListener('change',()=>{const file=msgInput.files[0];msgInput.value='';void importLocalMsg(file);});

readStorage();W.init(state);appearance();persist();render();initGlass();
})();
</script>
